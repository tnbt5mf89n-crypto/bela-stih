# The whole production stack: the game server (private) behind Caddy (public,
# automatic HTTPS). Run from this directory on the VPS:
#
#   DOMAIN=bela.example.com docker compose up -d --build
#
# Caddy terminates TLS for wss:// and https://, proxies the Colyseus traffic
# (matchmaking POSTs, the websocket, /health) to the game container, and serves
# the static privacy-policy page for everything else.
services:
  bela:
    # Tagged by the commit it was built from (deploy-server.sh writes BELA_TAG
    # into .env), so the previous build is still on the box and a rollback is
    # scripts/rollback-server.sh - about two minutes, no rebuild.
    image: bela-server:${BELA_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        GIT_SHA: ${BELA_TAG:-dev}
    restart: unless-stopped
    environment:
      # The kill switch (apps/server/src/config.ts), served by caddy from ./site.
      CONFIG_URL: https://${DOMAIN}/config.json
    # Marks the container unhealthy when it stops answering /health, so
    # `docker compose ps` says so where a hung event loop used to sit there
    # "Up" while every table was dead. Nothing restarts it by itself (plain
    # Docker acts on health only in Swarm; restart: unless-stopped fires on
    # exit) - UptimeRobot on /health is what alerts a human.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # PID 1 is npm, which does not reliably pass a stop signal on to the server
    # underneath it — so a restart hit the timeout and killed it outright.
    # tini sits in front and forwards the signal, letting Colyseus close the
    # sockets properly instead of having them cut.
    init: true
    expose:
      - "2567"
    # Container logs can incidentally contain connection metadata; cap them so
    # "we keep nothing" stays true in practice, not just in the code.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bela
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=bela.example.com docker compose up -d}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
