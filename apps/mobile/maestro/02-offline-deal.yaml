appId: com.slfresh.belastih
name: An offline deal against three bots, played to its result sheet and its review
# Učenje first: there the app refuses an illegal card, so only enabled cards
# are tapped, and it finds the zvanja itself. In Prava bela an illegal first
# card ends the deal by renons, with nothing to review (seen on the phone).
# Every fan card carries testID card-<id>; a tap on a legal one arms it and a
# second tap plays it (confirmPlay). The bid prompts are answered with their
# first button (action-0: a pass, or the forced call), a zvanja question with
# "Nemam" (declare-skip) should the mode ever ask one.
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-settings"
    timeout: 20000
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "mode-learn"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "mode-learn"
- tapOn:
    id: "back"
- extendedWaitUntil:
    visible:
      id: "home-offline"
    timeout: 20000
- tapOn:
    id: "home-offline"
- extendedWaitUntil:
    visible:
      id: "card-.*"
    timeout: 20000
- repeat:
    times: 120
    commands:
      - tapOn:
          id: "action-0"
          optional: true
      - tapOn:
          id: "declare-skip"
          optional: true
      - tapOn:
          id: "card-.*"
          enabled: true
          index: 0
          optional: true
      - tapOn:
          id: "card-.*"
          enabled: true
          index: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: "next-deal"
    timeout: 60000
- assertVisible:
    id: "review"
- tapOn:
    id: "review"
- assertVisible: "1\\. .*"
